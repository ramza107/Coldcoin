services:
  sealer1:
    image: ethereum/client-go:v1.13.15
    container_name: coldcoin-sealer1
    restart: unless-stopped
    volumes:
      - ./genesis/genesis.json:/genesis.json:ro
      - ./config:/config:ro
      - ./docker/entrypoint-sealer.sh:/entrypoint.sh:ro
      - sealer1-data:/root/.ethereum
    environment:
      SEALER_NAME: sealer1
      P2P_PORT: "30303"
    ports:
      - "30303:30303"
      - "30303:30303/udp"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      coldnet:
        ipv4_address: 172.28.0.11

  sealer2:
    image: ethereum/client-go:v1.13.15
    container_name: coldcoin-sealer2
    restart: unless-stopped
    volumes:
      - ./genesis/genesis.json:/genesis.json:ro
      - ./config:/config:ro
      - ./docker/entrypoint-sealer.sh:/entrypoint.sh:ro
      - sealer2-data:/root/.ethereum
    environment:
      SEALER_NAME: sealer2
      P2P_PORT: "30303"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      coldnet:
        ipv4_address: 172.28.0.12

  sealer3:
    image: ethereum/client-go:v1.13.15
    container_name: coldcoin-sealer3
    restart: unless-stopped
    volumes:
      - ./genesis/genesis.json:/genesis.json:ro
      - ./config:/config:ro
      - ./docker/entrypoint-sealer.sh:/entrypoint.sh:ro
      - sealer3-data:/root/.ethereum
    environment:
      SEALER_NAME: sealer3
      P2P_PORT: "30303"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      coldnet:
        ipv4_address: 172.28.0.13

  rpc:
    image: ethereum/client-go:v1.13.15
    container_name: coldcoin-rpc
    restart: unless-stopped
    depends_on:
      - sealer1
      - sealer2
      - sealer3
    volumes:
      - ./genesis/genesis.json:/genesis.json:ro
      - ./config:/config:ro
      - ./docker/entrypoint-rpc.sh:/entrypoint.sh:ro
      - rpc-data:/root/.ethereum
    ports:
      - "8545:8545"
      - "8546:8546"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks:
      coldnet:
        ipv4_address: 172.28.0.20

  peer-mesh:
    image: ethereum/client-go:v1.13.15
    container_name: coldcoin-peer-mesh
    depends_on:
      - sealer1
      - sealer2
      - sealer3
      - rpc
    volumes:
      - ./docker/connect-docker.sh:/connect.sh:ro
    entrypoint: ["/bin/sh", "/connect.sh"]
    networks:
      coldnet:
        ipv4_address: 172.28.0.30
    restart: unless-stopped

networks:
  coldnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  sealer1-data:
  sealer2-data:
  sealer3-data:
  rpc-data:
